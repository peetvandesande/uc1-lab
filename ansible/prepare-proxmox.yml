# One-time preparation of a Proxmox host for this lab. Safe to re-run.
# ansible/teardown.yml leaves it all in place.
#
#   - turns on IPv4 forwarding, so the host routes between the LAN and the lab
#   - binds the GPU (GPU_PCI_* in network.conf) to vfio-pci and enables the
#     IOMMU, so OpenTofu can pass it through to worker-1. This takes the GPU
#     away from the host - make sure nothing on it (a container, a desktop)
#     still uses the card - and needs one reboot, which the playbook asks for
#     rather than performs. Reverting is deleting the two uc1-vfio files,
#     removing the cmdline additions and rebooting.
#   - masks nvidia-devnodes.service and nvidia-persistenced.service, which
#     fail without a host driver and would only trip the Grafana alerts
#     (teardown leaves them masked; `systemctl unmask` them when the card
#     goes back to the host)
#
# Usage (from the repository root):
#   ansible-playbook ansible/prepare-proxmox.yml [-e proxmox_target=user@host]
#   Skip the GPU part with -e gpu=false (then build with gpu_worker=false).
#   Module configuration that conflicts with the passthrough (another file
#   setting vfio-pci ids, or an nvidia/nouveau force-load) makes the play
#   fail by name; -e cleanup_conflicts=true removes those files instead.

- name: Read the lab settings
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    repo: "{{ playbook_dir }}/.."
    proxmox_target: ""
  tasks:
    - ansible.builtin.import_tasks: tasks/target.yml

- name: Prepare Proxmox
  hosts: proxmox
  gather_facts: false
  vars:
    gpu: true
    cleanup_conflicts: false
    gpu_dev: "{{ lab_net.gpu_pci_address }}.0"
    nvidia_units: [nvidia-devnodes.service, nvidia-persistenced.service]
  tasks:
    # SDN only enables forwarding on its own vnets; traffic from the LAN
    # arrives on the host's main bridge
    - name: Turn on IPv4 forwarding
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        sysctl_file: /etc/sysctl.d/90-ip-forward.conf

    - name: Bind the GPU to vfio-pci
      when: gpu | bool
      block:
        - name: Look at the GPU
          ansible.builtin.shell: |
            lspci -nn -s {{ lab_net.gpu_pci_address }}
            echo "driver=$(basename $(readlink /sys/bus/pci/devices/{{ gpu_dev }}/driver) 2>/dev/null || echo none)"
            echo "iommu=$(ls /sys/class/iommu/ 2>/dev/null | wc -l)"
          register: gpu_state
          changed_when: false

        - name: Check the GPU is where network.conf says
          ansible.builtin.assert:
            that: gpu_state.stdout_lines | select('search', 'NVIDIA') | list | length > 0
            fail_msg: "no NVIDIA device at {{ lab_net.gpu_pci_address }} – fix GPU_PCI_ADDRESS in network.conf"
            quiet: true

        # Anything else that configures these modules can silently win:
        # kmod applies every modprobe.d file and the kernel keeps the LAST
        # ids= assignment, and a force-loaded nvidia_uvm pulls nvidia in
        # past any blacklist. Found on lenora the first time round: a
        # leftover vfio.conf with a typo'd vendor id, and the jellyfin-era
        # modules-load.d/nvidia.conf
        - name: Look for conflicting module configuration
          ansible.builtin.shell: |
            grep -lE '^[[:space:]]*options[[:space:]]+vfio[-_]pci\b' /etc/modprobe.d/* 2>/dev/null | grep -v '/uc1-vfio.conf$' || true
            grep -lE '^[[:space:]]*(nvidia|nouveau)' /etc/modules-load.d/* 2>/dev/null || true
            grep -qE '^[[:space:]]*(nvidia|nouveau)' /etc/modules 2>/dev/null && echo /etc/modules || true
          register: conflicts
          changed_when: false

        - name: Remove the conflicting files
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop: "{{ conflicts.stdout_lines | reject('equalto', '/etc/modules') | list }}"
          when: cleanup_conflicts | bool
          register: conflicts_removed

        - name: Check nothing conflicts
          ansible.builtin.assert:
            that: cleanup_conflicts | bool or conflicts.stdout | length == 0
            fail_msg: >-
              these files also configure vfio-pci or force-load the GPU
              drivers and would defeat the passthrough:
              {{ conflicts.stdout_lines | join(', ') }} –
              re-run with -e cleanup_conflicts=true to remove them
              (/etc/modules is never removed: edit it by hand)
            quiet: true

        - name: Check /etc/modules by hand
          ansible.builtin.assert:
            that: "'/etc/modules' not in conflicts.stdout_lines"
            fail_msg: /etc/modules force-loads nvidia or nouveau – remove those lines by hand (the file may hold unrelated modules)
            quiet: true

        # The host must not load a display driver for the card; vfio-pci has
        # to claim it first. softdep orders that without blacklisting, so a
        # revert is deleting these files
        - name: Claim the GPU for vfio-pci at boot
          ansible.builtin.copy:
            dest: /etc/modprobe.d/uc1-vfio.conf
            content: |
              # uc1-lab: the P2200 is passed through to a VM
              options vfio-pci ids={{ lab_net.gpu_pci_ids }}
              softdep nouveau pre: vfio-pci
              softdep nvidia pre: vfio-pci
              softdep snd_hda_intel pre: vfio-pci
            mode: "0644"
          register: modprobe_conf

        - name: Load the vfio modules at boot
          ansible.builtin.copy:
            dest: /etc/modules-load.d/uc1-vfio.conf
            content: |
              vfio
              vfio_iommu_type1
              vfio_pci
            mode: "0644"
          register: modules_conf

        - name: Read the kernel command line
          ansible.builtin.slurp:
            src: /etc/kernel/cmdline
          register: cmdline

        - name: Enable the IOMMU on the kernel command line
          ansible.builtin.copy:
            dest: /etc/kernel/cmdline
            content: "{{ cmdline.content | b64decode | trim }} intel_iommu=on iommu=pt\n"
            mode: "0644"
          when: "'intel_iommu=on' not in (cmdline.content | b64decode)"
          register: cmdline_conf

        - name: Apply the boot configuration
          ansible.builtin.command: "{{ item }}"
          loop:
            - update-initramfs -u -k all
            - proxmox-boot-tool refresh
          when: modprobe_conf is changed or modules_conf is changed or cmdline_conf is changed or conflicts_removed is changed
          changed_when: true

        # With vfio-pci holding the card these units have nothing to start
        # against and sit failed, which alerts
        - name: Mask the host's nvidia units
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            masked: true
          loop: "{{ nvidia_units }}"

        - name: Report
          ansible.builtin.debug:
            msg: >-
              {{ 'GPU already on vfio-pci with the IOMMU up – nothing to do.'
                 if 'driver=vfio-pci' in gpu_state.stdout_lines and not (gpu_state.stdout_lines | select('equalto', 'iommu=0') | list | length > 0)
                 else 'Configured. Reboot the host (checking nothing critical runs on it first), then re-run this playbook to confirm the GPU is on vfio-pci.' }}

    - name: Done
      ansible.builtin.debug:
        msg: "Next: ansible-playbook ansible/bootstrap.yml"
