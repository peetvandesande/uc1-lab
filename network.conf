# Lab network: built on the Proxmox host by ansible/bootstrap.yml, read by
# OpenTofu for the node addresses and by the playbooks. See NETWORK.md for
# the design.

SDN_ZONE=uc1

# What the lab claims of 192.168.32.0/21, the range the LAN router routes to
# the Proxmox host. One /24 only, disjoint from openstack-lab's subnets
# (.32-.38), so this lab coexists with that zone's definition - though not
# with its running VMs, for RAM. The bootstrap refuses to run while another
# SDN zone overlaps this range. Set LAB_SNAT=yes if the router cannot NAT
# the range to the internet, and the Proxmox host source-NATs it instead.
LAB_RANGE=192.168.39.0/24
LAB_SNAT=no

# The one lab network: nodes, the Kubernetes API VIP and the LoadBalancer
# pool all live here. Vnet names are at most 8 characters.
NODE_VNET=uc1net
NODE_SUBNET=192.168.39.0/24
NODE_GATEWAY=192.168.39.1

# Control plane n is CP_HOST_START + n - 1, worker n WORKER_HOST_START + n - 1.
# The kube-apiserver VIP (Talos shared VIP) is VIP_HOST.
CP_HOST_START=11
WORKER_HOST_START=21
VIP_HOST=10

# Cilium LB-IPAM hands LoadBalancer services addresses from this pool;
# ingress-nginx takes the first one
LB_POOL_START=192.168.39.100
LB_POOL_END=192.168.39.199

# Talos image: version and Image Factory schematics. The schematic id is a
# content hash of the extension list - regenerate with
#   curl -s -X POST https://factory.talos.dev/schematics \
#     -d '{"customization":{"systemExtensions":{"officialExtensions":[...]}}}'
# BASE carries qemu-guest-agent; GPU adds nonfree-kmod-nvidia-lts and
# nvidia-container-toolkit-lts. The -lts extensions carry driver 580, the
# last branch that supports the Pascal P2200 - the -production branch (595+)
# dropped it. Upgrade targets for module 90 are in docs/90-upgrades.md.
TALOS_VERSION=v1.13.12
TALOS_SCHEMATIC_BASE=ce4c980550dd2ab1b17bbf2b08801c7eb59418eafe8f279833297925d67c7515
TALOS_SCHEMATIC_GPU=9ad39c156013e1e82f18ddef8e1e1b2cd98c3553566fb2896e1a69889260388c

# The GPU passed through to worker-1: PCI address on the Proxmox host and
# the vendor:device ids vfio-pci must claim at boot (GPU + its audio
# function). ansible/prepare-proxmox.yml uses these; lspci -nn confirms them.
# Only root may put a raw PCI address in a VM config, so the bootstrap wraps
# the device in a cluster resource mapping (GPU_MAPPING) and grants the
# Terraform token PVEMappingUser on it; the VM config references the mapping.
GPU_PCI_ADDRESS=0000:86:00
GPU_PCI_IDS=10de:1c31,10de:10f1
GPU_MAPPING=uc1-gpu

# For the nodes: Themis, the LAN's resolver
DNS_SERVERS="192.168.8.50"
NTP_SERVERS="192.168.8.21"

# The lab's names. The bootstrap creates DOMAIN and the reverse zone on the
# PowerDNS authoritative server through its API (called from the Proxmox
# host); the teardown deletes the lab's zones. The API
# key is AUTH_API_KEY in PDNS_API_KEY_FILE, relative to this repository, or
# the PDNS_API_KEY environment variable. Leave PDNS_API empty to skip DNS
DOMAIN=uc1.home
PDNS_API=https://pythia.home:8081
PDNS_SERVER_NS=pythia.home
PDNS_API_KEY_FILE=../homelab/dns/secrets.env
