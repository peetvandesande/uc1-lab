# Cilium CNI, kube-proxy replacement, LB-IPAM. Depends on cert-manager:
# Hubble's certificates are cert-manager Certificates, so the HelmRelease
# cannot render before the CRDs and the uc1-ca issuer exist. The CNI
# itself never waits on this - scripts/bootstrap-cluster.sh installs it
# before Flux runs at all.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: 10-cilium
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./modules/10-cilium
  prune: true
  wait: true
  dependsOn:
    - name: 17-issuers
