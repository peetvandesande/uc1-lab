# Kyverno policies and NetworkPolicies
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: 60-policy
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./modules/60-policy
  prune: true
  wait: true
  dependsOn:
    - name: 10-cilium
