# ingress-nginx on the first LoadBalancer address
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: 16-ingress
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./modules/16-ingress
  prune: true
  wait: true
  dependsOn:
    - name: 10-cilium
    - name: 20-observability
