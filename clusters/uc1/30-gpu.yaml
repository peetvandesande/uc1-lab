# NVIDIA GPU Operator (driver and toolkit come from Talos)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: 30-gpu
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./modules/30-gpu
  prune: true
  wait: true
  dependsOn:
    - name: 20-observability
