# KEDA - split out so 40's ScaledObject never shares a dry-run with the chart that installs its CRD
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: 35-keda
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./modules/35-keda
  prune: true
  wait: true
  dependsOn:
    - name: 10-cilium
