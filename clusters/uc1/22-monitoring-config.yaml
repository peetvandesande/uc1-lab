# The lab's alert rules and the Flux PodMonitor - CRD consumers, split from the chart that provides the CRDs
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: 22-monitoring-config
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./modules/22-monitoring-config
  prune: true
  wait: true
  dependsOn:
    - name: 20-observability
