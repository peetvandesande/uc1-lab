# vLLM (CPU), Ollama (GPU), mock NIM, KEDA
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: 40-inference
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./modules/40-inference
  prune: true
  wait: true
  dependsOn:
    - name: 16-ingress
    - name: 35-keda
    - name: 20-observability
    - name: 30-gpu
