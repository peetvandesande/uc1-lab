# Tier 1: presentation. The unprivileged nginx serves a static page and
# proxies /api/ to the application tier - so the browser only ever talks
# to this pod, and the network policy can say so.
apiVersion: v1
kind: ConfigMap
metadata:
  name: web
  namespace: demo
data:
  default.conf: |
    server {
        listen 8080;
        location /api/ {
            proxy_pass http://api:8000/;
        }
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
    }
  index.html: |
    <!doctype html>
    <html lang="en">
    <head><meta charset="utf-8"><title>uc1 demo</title>
    <style>
      body { font: 16px/1.5 system-ui; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; }
      input, button { font: inherit; padding: .4rem .6rem; }
      li { margin: .2rem 0; } small { color: #666; }
    </style></head>
    <body>
      <h1>Visitors</h1>
      <p>web (nginx) &rarr; api (python) &rarr; db (postgres), one namespace, policies between the arrows.</p>
      <form id="f"><input id="n" placeholder="your name" required><button>Sign</button></form>
      <ul id="l"></ul>
      <script>
        const load = async () => {
          const r = await fetch('/api/visits');
          document.getElementById('l').innerHTML = (await r.json())
            .map(v => `<li>${v.name.replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))} <small>${v.at}</small></li>`).join('');
        };
        document.getElementById('f').onsubmit = async e => {
          e.preventDefault();
          await fetch('/api/visits', {method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name: document.getElementById('n').value})});
          document.getElementById('n').value = ''; load();
        };
        load();
      </script>
    </body></html>
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: demo
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: demo
  labels:
    app.kubernetes.io/name: web
    uc1.home/data-residency: eu
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: web}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        uc1.home/data-residency: eu
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.29-alpine
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /, port: http}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: conf
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: conf
          configMap: {name: web}
