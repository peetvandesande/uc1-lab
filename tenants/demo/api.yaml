# Tier 2: the application. A deliberately small Python API - GET and POST
# /visits against Postgres. The dependency is installed at container
# start to keep the demo image-build-free; a real tenant would build an
# image and push it to registry.uc1.home (module 50's workflow).
apiVersion: v1
kind: ConfigMap
metadata:
  name: api
  namespace: demo
data:
  api.py: |
    import json, os, http.server
    import psycopg

    DSN = "host={PGHOST} dbname={POSTGRES_DB} user={POSTGRES_USER} password={POSTGRES_PASSWORD}".format(**os.environ)

    with psycopg.connect(DSN) as c:
        c.execute("CREATE TABLE IF NOT EXISTS visits (id serial PRIMARY KEY, name text NOT NULL, at timestamptz DEFAULT now())")

    class H(http.server.BaseHTTPRequestHandler):
        def _send(self, code, body):
            data = json.dumps(body).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)

        def do_GET(self):
            if self.path == "/healthz":
                return self._send(200, {"ok": True})
            if self.path == "/visits":
                with psycopg.connect(DSN) as c:
                    rows = c.execute("SELECT name, at FROM visits ORDER BY id DESC LIMIT 20").fetchall()
                return self._send(200, [{"name": n, "at": a.isoformat()} for n, a in rows])
            self._send(404, {"error": "not found"})

        def do_POST(self):
            if self.path != "/visits":
                return self._send(404, {"error": "not found"})
            length = int(self.headers.get("Content-Length", 0))
            name = (json.loads(self.rfile.read(length) or "{}").get("name") or "anonymous")[:80]
            with psycopg.connect(DSN) as c:
                c.execute("INSERT INTO visits (name) VALUES (%s)", (name,))
            self._send(201, {"ok": True})

        def log_message(self, *a):
            pass

    http.server.ThreadingHTTPServer(("", 8000), H).serve_forever()
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: demo
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: demo
  labels:
    app.kubernetes.io/name: api
    uc1.home/data-residency: eu
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: api}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        uc1.home/data-residency: eu
    spec:
      containers:
        - name: api
          image: python:3.13-slim
          command: [sh, -c]
          args:
            - pip install --quiet --no-cache-dir "psycopg[binary]~=3.2" && exec python -I /app/api.py
          env:
            - name: PGHOST
              value: db
          envFrom:
            - secretRef: {name: db}
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 24   # pip install happens first
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - name: app
              mountPath: /app
      volumes:
        - name: app
          configMap: {name: api}
