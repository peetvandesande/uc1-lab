# Who may act inside the tenant. The lab has no identity provider, so the
# group is notional - but the binding is the real pattern: tenants get
# namespace-scoped admin, never cluster roles. Impersonate it to test:
#   kubectl --as=jo --as-group=demo-team -n demo get pods     # allowed
#   kubectl --as=jo --as-group=demo-team get nodes            # forbidden
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: demo-team
  namespace: demo
subjects:
  - kind: Group
    name: demo-team
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: admin        # built-in: full control inside the namespace, nothing outside
  apiGroup: rbac.authorization.k8s.io
