# A stand-in for NVIDIA NIM. The real thing needs an NGC licence and a
# Turing-or-newer GPU, neither of which this lab has - but its operational
# surface (an OpenAI-compatible API, /v1/health/ready, Prometheus metrics,
# one model per container) can be mimicked well enough to practise the
# deployment patterns, probes, scaling and dashboards around it. The 50-
# module's ModelDeployment operator uses this image for engine: nim.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mock-nim
  namespace: inference
data:
  server.py: |
    import http.server, json, random, time

    MODEL = "mock/nim-llm"
    START = time.time()
    requests_total = 0
    tokens_total = 0

    class H(http.server.BaseHTTPRequestHandler):
        def _send(self, code, body, ctype="application/json"):
            data = body.encode() if isinstance(body, str) else json.dumps(body).encode()
            self.send_response(code)
            self.send_header("Content-Type", ctype)
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)

        def do_GET(self):
            if self.path == "/v1/models":
                self._send(200, {"object": "list", "data": [
                    {"id": MODEL, "object": "model", "owned_by": "uc1-lab"}]})
            elif self.path in ("/v1/health/ready", "/v1/health/live"):
                self._send(200, {"status": "ok"})
            elif self.path == "/metrics":
                up = time.time() - START
                self._send(200,
                    "# TYPE num_requests_running gauge\n"
                    "num_requests_running 0\n"
                    "# TYPE num_requests_waiting gauge\n"
                    "num_requests_waiting 0\n"
                    "# TYPE request_success_total counter\n"
                    f"request_success_total {requests_total}\n"
                    "# TYPE generation_tokens_total counter\n"
                    f"generation_tokens_total {tokens_total}\n"
                    "# TYPE uptime_seconds gauge\n"
                    f"uptime_seconds {up:.0f}\n",
                    "text/plain")
            else:
                self._send(404, {"error": "not found"})

        def do_POST(self):
            global requests_total, tokens_total
            if self.path != "/v1/chat/completions":
                return self._send(404, {"error": "not found"})
            length = int(self.headers.get("Content-Length", 0))
            body = json.loads(self.rfile.read(length) or "{}")
            time.sleep(random.uniform(0.05, 0.3))  # pretend to think
            text = "This is the mock NIM answering on behalf of %s." % MODEL
            requests_total += 1
            tokens_total += len(text.split())
            self._send(200, {
                "id": "chatcmpl-mock", "object": "chat.completion",
                "model": body.get("model", MODEL),
                "choices": [{"index": 0, "finish_reason": "stop",
                             "message": {"role": "assistant", "content": text}}],
                "usage": {"prompt_tokens": 10, "completion_tokens": len(text.split()),
                          "total_tokens": 10 + len(text.split())}})

        def log_message(self, *a):
            pass

    http.server.ThreadingHTTPServer(("", 8000), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-nim
  namespace: inference
  labels:
    app.kubernetes.io/name: mock-nim
    uc1.home/data-residency: eu
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mock-nim
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock-nim
        uc1.home/data-residency: eu
    spec:
      containers:
        - name: mock-nim
          image: python:3.13-slim
          command: [python, -I, /app/server.py]
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /v1/health/ready
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: app
              mountPath: /app
      volumes:
        - name: app
          configMap:
            name: mock-nim
---
apiVersion: v1
kind: Service
metadata:
  name: mock-nim
  namespace: inference
spec:
  selector:
    app.kubernetes.io/name: mock-nim
  ports:
    - name: http
      port: 8000
      targetPort: http
