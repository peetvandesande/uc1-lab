# GPU inference through Ollama (llama.cpp inside), which still supports
# Pascal. Scheduled onto the GPU worker by the taint/toleration and the
# nvidia.com/gpu resource the device plugin advertises; the nvidia
# RuntimeClass injects the driver libraries from the Talos extension.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: inference
  labels:
    app.kubernetes.io/name: ollama
    uc1.home/data-residency: eu
spec:
  replicas: 1
  strategy:
    type: Recreate # one GPU, so the old pod must release it first
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
        uc1.home/data-residency: eu
    spec:
      runtimeClassName: nvidia
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: ollama
          image: ollama/ollama:0.40.11
          ports:
            - name: http
              containerPort: 11434
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              memory: 8Gi
              nvidia.com/gpu: 1
          # Pull a model that fits the P2200's 5GB alongside its KV cache
          lifecycle:
            postStart:
              exec:
                command: [ollama, pull, qwen2.5:0.5b]
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: inference
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: inference
spec:
  selector:
    app.kubernetes.io/name: ollama
  ports:
    - name: http
      port: 11434
      targetPort: http
