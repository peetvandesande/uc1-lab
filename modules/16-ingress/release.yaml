# ingress-nginx on the first LoadBalancer address; ingress.uc1.home points
# at it, and the service names are CNAMEs onto that.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: ingress-nginx
spec:
  interval: 30m
  chart:
    spec:
      chart: ingress-nginx
      version: 4.15.1
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
  values:
    controller:
      service:
        annotations:
          lbipam.cilium.io/ips: 192.168.39.100
      ingressClassResource:
        default: true
      metrics:
        enabled: true
        # the ServiceMonitor CRD comes with 20-observability, which this
        # module therefore depends on
        serviceMonitor:
          enabled: true
