# The lab's own CA: a self-signed root kept in a secret. The ingresses now
# issue from step-ca (see step-ca-issuer.yaml); this issuer remains for
# certificates ACME cannot do - Hubble's internal SANs are not HTTP-01
# provable - and as the fallback when pistis is unreachable.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: uc1-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: uc1 lab CA
  secretName: uc1-ca
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: ClusterIssuer
    name: selfsigned
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: uc1-ca
spec:
  ca:
    secretName: uc1-ca
