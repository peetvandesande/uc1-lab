# The lab's own CA: a self-signed root kept in a secret, and a CA issuer the
# ingresses use. Browsers will not trust it unless uc1-ca.crt (in the
# uc1-ca secret) is imported; see docs/15-ingress.md.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: uc1-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: uc1 lab CA
  secretName: uc1-ca
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: ClusterIssuer
    name: selfsigned
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: uc1-ca
spec:
  ca:
    secretName: uc1-ca
