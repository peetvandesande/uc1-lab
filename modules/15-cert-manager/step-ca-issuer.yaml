# The homelab's real CA: ACME against step-ca on pistis. Everything the LAN
# already trusts (the G2 root) now signs the lab's ingress certificates;
# lifetimes are Let's Encrypt-shaped and cert-manager renews. caBundle is
# the G2 root, so cert-manager trusts the ACME endpoint's own TLS.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: step-ca
spec:
  acme:
    server: https://pistis.home:8443/acme/acme/directory
    caBundle: 
    privateKeySecretRef:
      name: step-ca-acme-account
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
