# local-path-provisioner v0.0.37, vendored from
# https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.37/deploy/local-path-storage.yaml
# and made the default StorageClass. Node-local hostPath volumes: a pod with
# a PVC is pinned to the node that holds its data, which is exactly the
# sharp edge several drills are built around.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - local-path-storage.yaml
patches:
  - target:
      kind: StorageClass
      name: local-path
    patch: |
      - op: add
        path: /metadata/annotations
        value:
          storageclass.kubernetes.io/is-default-class: "true"
