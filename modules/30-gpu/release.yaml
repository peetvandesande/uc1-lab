# The NVIDIA GPU Operator, with the two pieces Talos already provides turned
# off: the kernel driver (the nonfree-kmod-nvidia-lts system extension,
# driver branch 580 - the last that knows the Pascal P2200) and the container
# toolkit (its own extension). What is left is what the operator is really
# for in this lab: NFD labelling, the device plugin, DCGM metrics and the
# validator - the CRD/controller machinery of the JD.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-operator
  namespace: gpu-operator
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: gpu-operator
      version: v26.7.2
      sourceRef:
        kind: HelmRepository
        name: nvidia
  values:
    driver:
      enabled: false
    toolkit:
      enabled: false
    dcgmExporter:
      serviceMonitor:
        enabled: true
    daemonsets:
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
