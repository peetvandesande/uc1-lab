# Cilium is first installed by scripts/bootstrap-cluster.sh (no CNI, no Flux);
# this HelmRelease adopts that release - same name, same namespace - and
# manages it from then on. Values live in values.yaml, the single copy both
# use.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: cilium
      version: 1.20.4
      sourceRef:
        kind: HelmRepository
        name: cilium
  valuesFrom:
    - kind: ConfigMap
      name: cilium-values
      valuesKey: values.yaml
