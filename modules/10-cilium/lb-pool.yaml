# The LoadBalancer address pool (LB_POOL in network.conf). ingress-nginx
# pins .100 and the registry .101; everything else gets the next free one.
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: uc1
spec:
  blocks:
    - start: 192.168.39.100
      stop: 192.168.39.199
---
# Announce the pool from the workers over eth0
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: uc1
spec:
  interfaces:
    - eth0
  externalIPs: true
  loadBalancerIPs: true
