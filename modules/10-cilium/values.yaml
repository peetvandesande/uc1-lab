# Cilium on Talos: no kube-proxy (cluster.proxy.disabled in the machine
# config), API reached through KubePrism on every node, cgroups left where
# Talos mounts them, and the capability set Talos requires.
ipam:
  mode: kubernetes

# Native routing, not VXLAN: every node sits on the same L2 (uc1net), so
# nodes route each other's pod CIDRs directly. The tunnel cost more than
# overhead here - a full-size frame arriving from the LAN for a
# LoadBalancer address could not be VXLAN-forwarded to a backend on
# another node (+50 bytes > MTU), which broke exactly and only bulk
# ingress like registry pushes, and only when the L2 lease holder and the
# backend pod were on different nodes.
routingMode: native
autoDirectNodeRoutes: true
ipv4NativeRoutingCIDR: 10.244.0.0/16

kubeProxyReplacement: true
k8sServiceHost: localhost
k8sServicePort: 7445

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

# LoadBalancer services: LB-IPAM hands out the pool in lb-pool.yaml and L2
# announcements answer ARP for those addresses on the lab vnet
l2announcements:
  enabled: true
externalIPs:
  enabled: true

# L2 announcement leases lean on the API more than the default allows
k8sClientRateLimit:
  qps: 20
  burst: 100

operator:
  replicas: 1

hubble:
  # Hubble's mTLS certificates from cert-manager instead of Helm-generated
  # ones. The CA issuer (uc1-ca) signs them, not step-ca: their SANs
  # (*.hubble-grpc.cilium.io) are not HTTP-01 provable, so ACME cannot.
  # This makes the HelmRelease depend on cert-manager - the Flux order is
  # 15 before 10, which only works because scripts/bootstrap-cluster.sh
  # installs the CNI first with --set hubble.tls.auto.method=helm.
  tls:
    auto:
      enabled: true
      method: certmanagerIssuer
      certManagerIssuerRef:
        group: cert-manager.io
        kind: ClusterIssuer
        name: uc1-ca
  relay:
    enabled: true
  ui:
    enabled: true
