# Cilium on Talos: no kube-proxy (cluster.proxy.disabled in the machine
# config), API reached through KubePrism on every node, cgroups left where
# Talos mounts them, and the capability set Talos requires.
ipam:
  mode: kubernetes

kubeProxyReplacement: true
k8sServiceHost: localhost
k8sServicePort: 7445

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

# LoadBalancer services: LB-IPAM hands out the pool in lb-pool.yaml and L2
# announcements answer ARP for those addresses on the lab vnet
l2announcements:
  enabled: true
externalIPs:
  enabled: true

# L2 announcement leases lean on the API more than the default allows
k8sClientRateLimit:
  qps: 20
  burst: 100

operator:
  replicas: 1

hubble:
  relay:
    enabled: true
  ui:
    enabled: true
