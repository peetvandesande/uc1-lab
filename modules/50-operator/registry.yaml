# A small image registry for the operator's images (and anything else built
# locally). Plain HTTP on its own LoadBalancer address: the machine config's
# registry mirror tells containerd, and the workstation's Docker needs
# registry.uc1.home in insecure-registries (docs/50-operator.md).
apiVersion: v1
kind: Namespace
metadata:
  name: registry
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry
  namespace: registry
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: registry
  labels:
    app.kubernetes.io/name: registry
spec:
  replicas: 1
  strategy:
    type: Recreate # the PVC is RWO
  selector:
    matchLabels:
      app.kubernetes.io/name: registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry
    spec:
      containers:
        - name: registry
          image: registry:2
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: registry
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: registry
  annotations:
    lbipam.cilium.io/ips: 192.168.39.101
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: registry
  ports:
    - name: http
      port: 80
      targetPort: http
